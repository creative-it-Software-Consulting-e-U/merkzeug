appId: com.creative-it.merkzeug
productName: Merkzeug
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
artifactName: Merkzeug-${version}-${os}-${arch}.${ext}
extraResources:
  - from: ../LICENSE
    to: LICENSE
  - from: resources/THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt
  - from: resources/help
    to: help
mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  # EventKit-Helfer für „Neue Meeting-Notiz" (vor dem Packen kompiliert,
  # siehe Skript build:calhelper)
  extraResources:
    - from: resources/calendar/merkzeug-calendar
      to: calendar/merkzeug-calendar
  extendInfo:
    NSCalendarsUsageDescription: >-
      Merkzeug reads calendar events to create meeting notes.
    NSCalendarsFullAccessUsageDescription: >-
      Merkzeug reads calendar events to create meeting notes.
  # Signiert automatisch mit dem "Developer ID Application"-Zertifikat
  # (Team 3BNJ4M9R56) aus dem Login-Schlüsselbund.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Notarisierung läuft automatisch, wenn APPLE_API_KEY, APPLE_API_KEY_ID
  # und APPLE_API_ISSUER gesetzt sind (siehe README), sonst wird sie
  # übersprungen.
win:
  icon: build/icon.png
  # Outlook-COM-Helfer für „Neue Meeting-Notiz"
  extraResources:
    - from: resources/calendar/merkzeug-calendar.ps1
      to: calendar/merkzeug-calendar.ps1
  target:
    - nsis
linux:
  icon: build/icon.png
  category: Office
  syncDesktopName: true
  target:
    - AppImage
    - deb
    - rpm
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
