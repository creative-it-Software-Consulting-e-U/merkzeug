name: Validate Linux packages
on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Architectures to build and test natively
        type: choice
        options: [both, x64, arm64]
        default: both
      package_run:
        description: 'Optional previous run containing matching linux-packages-<architecture> (retest unchanged binaries)'
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: linux-packages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.architecture == 'both' && '["x64","arm64"]' || format('["{0}"]', inputs.architecture)) }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    env:
      PACKAGE_ARCH: ${{ matrix.arch }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test && npm run typecheck && npm run check:version && npm run test:release
      - name: Install Linux packaging and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64 libfuse2t64
      - name: Download existing candidates for retesting
        if: inputs.package_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RUN: ${{ inputs.package_run }}
        run: |
          [[ "$PACKAGE_RUN" =~ ^[0-9]+$ ]] || exit 1
          gh run download "$PACKAGE_RUN" -n "linux-packages-$PACKAGE_ARCH" -D crossplatform/dist
          cd crossplatform/dist
          sha256sum -c SHA256SUMS.txt
      - if: inputs.package_run == ''
        run: python3 scripts/package-desktop.py linux "$PACKAGE_ARCH"
      - if: inputs.package_run == ''
        run: node scripts/inspect-desktop-package.mjs linux "$PACKAGE_ARCH" release-artifacts/linux-validation
      - name: Checksums
        run: |
          cd crossplatform/dist
          sha256sum *.AppImage *.deb *.rpm > SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: linux-packages-${{ matrix.arch }}
          path: |
            crossplatform/dist/*.AppImage
            crossplatform/dist/*.deb
            crossplatform/dist/*.rpm
            crossplatform/dist/SHA256SUMS.txt
          retention-days: 30
      - name: Install and test DEB in Ubuntu
        run: |
          version=$(cat VERSION)
          xvfb-run -a python3 scripts/install-validation-package.py "crossplatform/dist/Merkzeug-$version-linux-$PACKAGE_ARCH.deb" release-artifacts/linux-validation/deb --arch "$PACKAGE_ARCH"
      - name: Test AppImage in Ubuntu
        if: ${{ !cancelled() && hashFiles('crossplatform/dist/*.AppImage') != '' }}
        run: |
          version=$(cat VERSION)
          xvfb-run -a python3 scripts/install-validation-package.py "crossplatform/dist/Merkzeug-$version-linux-$PACKAGE_ARCH.AppImage" release-artifacts/linux-validation/appimage --arch "$PACKAGE_ARCH"
      - name: Install and test RPM in Fedora userspace
        if: ${{ !cancelled() && hashFiles('crossplatform/dist/*.rpm') != '' }}
        run: |
          docker run --rm -e PACKAGE_ARCH --security-opt seccomp=unconfined -v "$PWD:/workspace" -w /workspace fedora:44 bash scripts/test-fedora-package.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-validation-${{ matrix.arch }}
          path: release-artifacts/linux-validation
          retention-days: 30
