name: Build release draft
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      editions:
        description: 'Comma-separated editions (empty means complete matrix)'
        type: string
        default: ''
      screenshots:
        description: 'Store screenshots: keep, fill missing sets, or synchronize reviewed images'
        type: choice
        options: [keep, if-missing, sync]
        default: keep
      screenshot_platforms:
        description: 'Store platforms for optional screenshot upload'
        type: choice
        options: ["IOS,MAC_OS", "IOS", "MAC_OS"]
        default: "IOS,MAC_OS"
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  plan:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      preview: ${{ steps.version.outputs.preview }}
      editions: ${{ steps.editions.outputs.editions }}
      desktop: ${{ steps.editions.outputs.desktop }}
      intellij: ${{ steps.editions.outputs.intellij }}
      matrix: ${{ steps.editions.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" != tag ]]; then
            echo 'Run this workflow against an existing version tag.' >&2
            exit 1
          fi
          version=$(python3 scripts/version.py check --tag "$REF_NAME")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo 'preview=true' >> "$GITHUB_OUTPUT"
          else
            echo 'preview=false' >> "$GITHUB_OUTPUT"
          fi
      - id: editions
        env:
          RELEASE_EDITIONS: ${{ inputs.editions }}
        run: python3 scripts/release-plan.py
  protection:
    needs: plan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Require protected signing for stable signed desktop editions
        if: needs.plan.outputs.preview == 'false' && (contains(needs.plan.outputs.editions, 'mac-') || contains(needs.plan.outputs.editions, 'win-'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-release-protection.py
  desktop:
    environment: ${{ needs.plan.outputs.preview == 'false' && matrix.platform != 'linux' && 'release-signing' || 'release-validation' }}
    needs: [checks, plan, protection]
    if: needs.plan.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: npm ci
      - if: matrix.platform == 'linux'
        run: |
          # Chrome is not used for packaging; avoid its unrelated apt index.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools
      - name: Build binaries (publishing disabled)
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          PREVIEW: ${{ needs.plan.outputs.preview }}
          MAC_CSC_LINK: ${{ needs.plan.outputs.preview == 'false' && matrix.platform == 'mac' && secrets.MAC_CSC_LINK || '' }}
          MAC_ICLOUD_PROFILE_BASE64: ${{ needs.plan.outputs.preview == 'false' && matrix.platform == 'mac' && secrets.MAC_ICLOUD_PROFILE_BASE64 || '' }}
          MAC_CSC_KEY_PASSWORD: ${{ needs.plan.outputs.preview == 'false' && matrix.platform == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          WINDOWS_CSC_LINK: ${{ needs.plan.outputs.preview == 'false' && matrix.platform == 'win' && secrets.WINDOWS_CSC_LINK || '' }}
          WINDOWS_CSC_KEY_PASSWORD: ${{ needs.plan.outputs.preview == 'false' && matrix.platform == 'win' && secrets.WINDOWS_CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY_BASE64: ${{ needs.plan.outputs.preview == 'false' && matrix.platform == 'mac' && secrets.APPLE_API_KEY_BASE64 || '' }}
          APPLE_API_KEY_ID: ${{ needs.plan.outputs.preview == 'false' && matrix.platform == 'mac' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ needs.plan.outputs.preview == 'false' && matrix.platform == 'mac' && secrets.APPLE_API_ISSUER || '' }}
        run: |
          if [[ "$PREVIEW" == false && "$PLATFORM" == mac ]]; then
            export MERKZEUG_MAC_PROFILE="$RUNNER_TEMP/merkzeug-developer-id.provisionprofile"
            python3 -c 'import os,base64,pathlib; p=pathlib.Path(os.environ["MERKZEUG_MAC_PROFILE"]); p.write_bytes(base64.b64decode(os.environ["MAC_ICLOUD_PROFILE_BASE64"], validate=True)); p.chmod(0o600)'
            export APPLE_API_KEY="$RUNNER_TEMP/merkzeug-notarization.p8"
            python3 -c 'import os,base64,pathlib; pathlib.Path(os.environ["APPLE_API_KEY"]).write_bytes(base64.b64decode(os.environ["APPLE_API_KEY_BASE64"], validate=True))'
          fi
          if [[ "$PREVIEW" == false ]]; then
            python3 scripts/package-desktop.py "$PLATFORM" "$ARCH" --signed
          else
            python3 scripts/package-desktop.py "$PLATFORM" "$ARCH"
          fi
      - name: Verify production publisher signatures
        if: needs.plan.outputs.preview == 'false' && matrix.platform != 'linux'
        run: python3 scripts/verify-desktop-signatures.py ${{ matrix.platform }} ${{ matrix.arch }}
      - name: Remove temporary signing files
        if: always() && matrix.platform == 'mac'
        shell: bash
        run: rm -f "$RUNNER_TEMP/merkzeug-notarization.p8" "$RUNNER_TEMP/merkzeug-developer-id.provisionprofile"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            crossplatform/dist/*.dmg
            crossplatform/dist/*.exe
            crossplatform/dist/*.AppImage
            crossplatform/dist/*.deb
            crossplatform/dist/*.rpm
  intellij:
    needs: [checks, plan]
    if: needs.plan.outputs.intellij == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Fetch checksum-pinned IDE SDK
        run: python3 scripts/fetch-intellij-sdk.py "$RUNNER_TEMP/merkzeug-sdk"
      - name: Build plugin
        shell: bash
        run: IDEA_HOME="$RUNNER_TEMP/merkzeug-sdk" npm run build:intellij
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: intellij
          path: intellij/dist/*.zip
          if-no-files-found: error
          retention-days: 14
  draft:
    environment: release-publishing
    needs: [checks, plan, protection, desktop, intellij]
    if: always() && needs.checks.result == 'success' && needs.plan.result == 'success' && needs.protection.result == 'success' && (needs.desktop.result == 'success' || needs.desktop.result == 'skipped') && (needs.intellij.result == 'success' || needs.intellij.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Assemble documentation and verify selected asset matrix
        env:
          MERKZEUG_RELEASE_SIGNING: ${{ needs.plan.outputs.preview == 'true' && 'Unsigned preview binaries; no macOS notarization or Windows publisher signature. IntelliJ ZIP is unsigned.' || 'Desktop macOS signing/notarization and Windows signing required by build; IntelliJ ZIP is unsigned.' }}
        run: python3 scripts/release-artifacts.py release-artifacts --editions "${{ needs.plan.outputs.editions }}"
      - name: Create a draft (never overwrite an existing release)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.plan.outputs.version }}
          PREVIEW: ${{ needs.plan.outputs.preview }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'A release already exists for this tag. Review it manually; artifacts were not overwritten.' >&2
            exit 1
          fi
          args=(--draft --verify-tag --title "Merkzeug $VERSION" --notes-file release-artifacts/release-notes.md)
          if [[ "$PREVIEW" == true ]]; then args+=(--prerelease); fi
          files=()
          for file in release-artifacts/*; do
            [[ "$file" == */release-notes.md ]] || files+=("$file")
          done
          gh release create "$TAG" "${args[@]}" "${files[@]}"

  store-screenshots:
    needs: [checks, plan]
    if: inputs.screenshots == 'if-missing' || inputs.screenshots == 'sync'
    uses: ./.github/workflows/upload-store-screenshots.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      platforms: ${{ inputs.screenshot_platforms }}
      mode: ${{ inputs.screenshots }}
      apply: true
