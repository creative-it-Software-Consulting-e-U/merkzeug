name: Upload App Store screenshots
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact existing App Store version (for example 1.0)'
        required: true
        type: string
      platforms:
        description: 'Store platforms'
        type: choice
        options: ["IOS,MAC_OS", "IOS", "MAC_OS"]
        default: "IOS,MAC_OS"
      mode:
        description: 'if-missing preserves populated sets; sync updates selected sets'
        type: choice
        options: [if-missing, sync]
        default: if-missing
      apply:
        description: 'Upload changes (unchecked = read-only plan)'
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      platforms:
        type: string
        default: 'IOS,MAC_OS'
      mode:
        type: string
        default: if-missing
      apply:
        type: boolean
        default: false
permissions:
  contents: read
# Serialize manual/release uploads for the same app; never interrupt a partial upload.
concurrency:
  group: merkzeug-app-store-screenshots
  cancel-in-progress: false
jobs:
  upload:
    if: github.repository == 'creative-it-Software-Consulting-e-U/merkzeug' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    environment: app-store-assets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - name: Validate reviewed screenshot bundle
        run: node scripts/upload-store-screenshots.mjs --validate-only
      - name: Plan or synchronize the selected version
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          STORE_VERSION: ${{ inputs.version }}
          STORE_PLATFORMS: ${{ inputs.platforms }}
          STORE_MODE: ${{ inputs.mode }}
          STORE_APPLY: ${{ inputs.apply }}
        shell: bash
        run: |
          args=(--version "$STORE_VERSION" --platforms "$STORE_PLATFORMS" --mode "$STORE_MODE")
          if [[ "$STORE_APPLY" == true ]]; then args+=(--apply); fi
          node scripts/upload-store-screenshots.mjs "${args[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: app-store-screenshot-upload-report
          path: release-artifacts/screenshot-upload.json
          retention-days: 30
          if-no-files-found: ignore
