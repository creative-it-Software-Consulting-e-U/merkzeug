name: Store screenshot candidates
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: screenshot-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:desktop
      - name: Capture isolated synthetic notebook
        run: python3 scripts/capture-mac-demo.py "$RUNNER_TEMP/raw-macos"
      - name: Compose localized store artwork and provenance
        run: python3 scripts/frame-store-screenshots.py "$RUNNER_TEMP/raw-macos" "$RUNNER_TEMP/store-macos" --edition macos
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: macos-screenshot-candidates
          path: |
            ${{ runner.temp }}/raw-macos
            ${{ runner.temp }}/store-macos
          if-no-files-found: error
          retention-days: 30
