name: Checks
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
# Keep this group distinct from callers of this reusable workflow.
concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: npm run check:secrets
      - run: npm ci
      - run: npm run check:version
      - run: npm run check:docs
      - run: node scripts/build-website.mjs
      - run: npm run check:licenses
      - run: python3 scripts/check-website.py
      - run: node scripts/upload-store-screenshots.mjs --validate-only
      - run: node scripts/upload-store-metadata.mjs --validate-only
      - run: npm test
      - run: npm run test:release
      - run: npm run typecheck
      - run: npm run build:desktop
      - run: npm run build:mobile
      - run: npm run build -w merkzeug-intellij-web
