name: Validate release candidates
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  desktop:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, platform: mac, arch: arm64}
          - {os: macos-15-intel, platform: mac, arch: x64}
          - {os: windows-2025, platform: win, arch: x64}
          - {os: windows-2025, platform: win, arch: arm64}
          - {os: ubuntu-24.04, platform: linux, arch: x64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: npm ci
      - if: matrix.platform == 'linux'
        run: |
          # Chrome is not used for packaging; avoid its unrelated apt index.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64 libfuse2t64
      - name: Build unsigned validation packages
        run: python scripts/package-desktop.py ${{ matrix.platform }} ${{ matrix.arch }}
      - name: Inspect packaged version, CPU architecture and notices
        run: node scripts/inspect-desktop-package.mjs ${{ matrix.platform }} ${{ matrix.arch }} release-artifacts/native-${{ matrix.platform }}-${{ matrix.arch }}
      - name: Install and exercise native candidate
        if: matrix.platform != 'win' || matrix.arch == 'x64'
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          version=$(cat VERSION)
          case "$PLATFORM" in
            mac) python3 scripts/install-validation-package.py "crossplatform/dist/Merkzeug-$version-mac-$ARCH.dmg" "release-artifacts/native-$PLATFORM-$ARCH" --arch "$ARCH" ;;
            win) python scripts/install-validation-package.py "crossplatform/dist/Merkzeug-$version-win-$ARCH.exe" "release-artifacts/native-$PLATFORM-$ARCH" --arch "$ARCH" ;;
            linux)
              xvfb-run -a python3 scripts/install-validation-package.py "crossplatform/dist/Merkzeug-$version-linux-$ARCH.deb" "release-artifacts/native-$PLATFORM-$ARCH/deb" --arch "$ARCH"
              xvfb-run -a python3 scripts/install-validation-package.py "crossplatform/dist/Merkzeug-$version-linux-$ARCH.AppImage" "release-artifacts/native-$PLATFORM-$ARCH/appimage" --arch "$ARCH"
              ;;
          esac
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: native-validation-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-artifacts/native-*
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: unsigned-validation-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            crossplatform/dist/*.dmg
            crossplatform/dist/*.exe
            crossplatform/dist/*.AppImage
            crossplatform/dist/*.deb
            crossplatform/dist/*.rpm
  intellij:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Fetch checksum-pinned IDE SDK
        run: python3 scripts/fetch-intellij-sdk.py "$RUNNER_TEMP/merkzeug-sdk"
      - name: Build plugin
        shell: bash
        run: IDEA_HOME="$RUNNER_TEMP/merkzeug-sdk" npm run build:intellij
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: intellij
          path: intellij/dist/*.zip
          if-no-files-found: error
          retention-days: 14

  assemble:
    needs: [desktop, intellij]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: unsigned-validation-*
          path: release-artifacts/candidate
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: intellij
          path: release-artifacts/candidate
      - run: python3 scripts/release-artifacts.py release-artifacts/candidate --complete
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-candidate-matrix
          path: release-artifacts/candidate
          retention-days: 30
